
spring.application.name=auth-service

server.port=8085

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:EduManageLocalDevelopmentSecretKey2026ChangeBeforeProduction}
app.jwt.expiration=86400000

# Default Admin
app.admin.email=${ADMIN_EMAIL:admin@edumanage.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
